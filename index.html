<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteFleak AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b12;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      background: #151522;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #1d1d2d;
      border-bottom: 1px solid #333344;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.5;
    }

    .ai {
      background: #292943;
    }

    .user {
      background: #5b35d5;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1d1d2d;
    }

    input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: #292943;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: #6c45ff;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>⚡ ByteFleak AI</h1>
      <p>Your AI assistant</p>
    </header>

    <div id="chat">
      <div class="message ai">
        Hello! 👋 Welcome to ByteFleak AI.
      </div>
    </div>

    <div class="input-area">
      <input
        id="userInput"
        type="text"
        placeholder="Ask ByteFleak AI..."
      >

      <button id="sendButton" type="button">
        Send
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");

    sendButton.onclick = function() {
      sendMessage();
    };

    function sendMessage() {

      alert("ByteFleak AI button is working!");

      const text = input.value.trim();

      if (!text) {
        return;
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;

      chat.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent = "Thinking...";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
