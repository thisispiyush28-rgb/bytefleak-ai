<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ByteFleak AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b12;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      background: #151522;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #1d1d2d;
      border-bottom: 1px solid #333344;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 14px;
      max-width: 85%;
      line-height: 1.5;
    }

    .ai {
      background: #292943;
    }

    .user {
      background: #5b35d5;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1d1d2d;
    }

    input {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: #292943;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: #6c45ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>⚡ ByteFleak AI</h1>
      <p>Your AI assistant</p>
    </header>

    <div id="chat">
      <div class="message ai">
        Hello! 👋 Welcome to ByteFleak AI.
      </div>
    </div>

    <div class="input-area">
      <input
        id="userInput"
        type="text"
        placeholder="Ask ByteFleak AI..."
      >

      <button id="sendButton" type="button">
        Send
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    async function sendMessage() {

      const text = input.value.trim();

      if (!text) {
        return;
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;

      chat.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent = "Thinking...";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;

      try {

        const response = await fetch(
          "https://script.google.com/macros/s/AKfycbz_-iiisClXMkdjaArzSbmYWRU-KwAQvjftlKzUNisQ1EgeGBc9aFaLgUquMWCIM3CqEA/exec",
          {
            method: "POST",
            body: JSON.stringify({
              message: text
            })
          }
        );

        const data = await response.json();

        if (
          data.candidates &&
          data.candidates[0] &&
          data.candidates[0].content &&
          data.candidates[0].content.parts &&
          data.candidates[0].content.parts[0]
        ) {

          aiMessage.textContent =
            data.candidates[0].content.parts[0].text;

        } else {

          aiMessage.textContent =
            "Sorry, I couldn't get a response.";

        }

      } catch (error) {

        console.error(error);

        aiMessage.textContent =
          "Connection error. Please try again.";

      }

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
